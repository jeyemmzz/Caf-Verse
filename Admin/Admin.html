<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaféVerse — Admin System Matrix</title>
    <link rel="stylesheet" href="Admin/AdminStyle.css">
</head>
<body>

    <div class="app-container">
        <div id="screen-admin" class="screen active">
            <button class="btn-back" onclick="logoutAdmin()">← Log Out / Exit System</button>
            <br><br>
            <span class="admin-badge">SYSTEM CONTROLLER ACCESS GRANTED</span>
            <h2 class="section-title">Live Stock & Inventory Matrix</h2>
            <p class="section-desc">Directly adjust live supply volume thresholds, add products, or delete records from the system matrix.</p>
            
            <div class="glass-panel form-box">
                <h3 class="panel-subtitle">✨ Add New Product to Matrix</h3>
                
                <div class="form-group">
                    <label>Café Target Branch</label>
                    <select class="form-control" id="admin-new-cafe">
                        <option value="Rainy Café">Rainy Café</option>
                        <option value="Midnight Café">Midnight Café</option>
                        <option value="Sakura Café">Sakura Café</option>
                        <option value="Beach Café">Beach Café</option>
                        <option value="Study Café">Study Café</option>
                        <option value="Gamer Café">Gamer Café</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Product Catalog Name</label>
                    <input type="text" class="form-control" id="admin-new-name" placeholder="e.g. Iced Matcha Latte">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select class="form-control" id="admin-new-type">
                            <option value="drinks">Drinks</option>
                            <option value="desserts">Desserts</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (₱)</label>
                        <input type="number" class="form-control" id="admin-new-price" placeholder="120">
                    </div>
                </div>

                <div class="form-group">
                    <label>Initial Stock Unit Count</label>
                    <input type="number" class="form-control" id="admin-new-stock" placeholder="15">
                </div>

                <button class="btn-primary" onclick="addNewProductRegistry()">[ Add Product to Catalog ]</button>
            </div>

            <div class="glass-panel registry-box">
                <h3 class="panel-subtitle">Global Dynamic Inventory List</h3>
                <div id="admin-live-inventory-list"></div>
            </div>
        </div>
    </div>

    <script src="Admin/AdminFunction.js"></script>
</body>
</html>
